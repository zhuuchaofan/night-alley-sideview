<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夜巷</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #10182b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #game-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #game-container canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }

      /* 触屏操作覆盖层: 只在 coarse pointer 设备上由 JS 创建。
         根容器不接事件, 只有左半边摇杆区与右侧按钮接事件,
         其余区域透传给画布 (门点击、菜单卡片点选不受影响)。
         按钮抬高到底部 27% 以上, 避开右下角的门区 (画布底边起约 65 CSS px)。 */
      #touch-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #touch-stick-zone {
        position: absolute;
        left: 0;
        top: 0;
        /* 左半边, 但给右侧按钮列留 224px (最左按钮左缘距右 212px + 12px 间隙):
           窄视口 (如竖屏 390px) 下按钮不侵入摇杆区 (Codex r1 S2)。 */
        width: min(50%, calc(100% - 224px));
        height: 100%;
        pointer-events: auto;
        touch-action: none;
      }

      #touch-stick-base {
        position: absolute;
        display: none;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(242, 227, 198, 0.4);
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }

      #touch-stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background-color: rgba(242, 227, 198, 0.45);
        pointer-events: none;
      }

      .touch-btn {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 2px solid #c9973f;
        border-radius: 50%;
        background-color: rgba(46, 33, 24, 0.55);
        color: #f2e3c6;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        pointer-events: auto;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .touch-btn.pressed {
        background-color: rgba(232, 179, 75, 0.75);
        color: #2e2118;
        transform: scale(0.92);
      }

      #sound-toggle {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 20;
        width: 44px;
        height: 44px;
        border: 2px solid #c9973f;
        border-radius: 0;
        background-color: #2e2118;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      #sound-toggle[hidden] {
        display: none;
      }

      #sound-toggle:focus,
      #sound-toggle:focus-visible {
        outline: 2px solid #fbf6e9;
        outline-offset: 2px;
      }

      #sound-toggle[aria-pressed='true'] .sound-waves {
        display: none;
      }

      #sound-toggle[aria-pressed='false'] .sound-slash {
        display: none;
      }
    </style>
  </head>
  <body>
    <button
      type="button"
      id="sound-toggle"
      aria-label="静音"
      aria-pressed="false"
    >
      <svg
        viewBox="0 0 16 16"
        width="24"
        height="24"
        aria-hidden="true"
        shape-rendering="crispEdges"
      >
        <g fill="#F2E3C6">
          <rect x="2" y="6" width="3" height="4" />
          <rect x="5" y="5" width="1" height="6" />
          <rect x="6" y="4" width="1" height="8" />
          <rect x="7" y="3" width="2" height="10" />
        </g>
        <g class="sound-waves" fill="#F2E3C6">
          <rect x="10" y="5" width="1" height="1" />
          <rect x="11" y="6" width="1" height="4" />
          <rect x="10" y="10" width="1" height="1" />
          <rect x="12" y="3" width="1" height="1" />
          <rect x="13" y="4" width="1" height="1" />
          <rect x="14" y="5" width="1" height="6" />
          <rect x="13" y="11" width="1" height="1" />
          <rect x="12" y="12" width="1" height="1" />
        </g>
        <g class="sound-slash" fill="#B03A2E">
          <rect x="12" y="2" width="2" height="2" />
          <rect x="10" y="4" width="2" height="2" />
          <rect x="8" y="6" width="2" height="2" />
          <rect x="6" y="8" width="2" height="2" />
          <rect x="4" y="10" width="2" height="2" />
          <rect x="2" y="12" width="2" height="2" />
        </g>
      </svg>
    </button>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
