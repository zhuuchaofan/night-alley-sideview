<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夜巷</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #10182b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #game-container {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-container canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      #sound-toggle {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 20;
        width: 44px;
        height: 44px;
        border: 2px solid #c9973f;
        border-radius: 0;
        background-color: #2e2118;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      #sound-toggle[hidden] {
        display: none;
      }

      #sound-toggle:focus,
      #sound-toggle:focus-visible {
        outline: 2px solid #fbf6e9;
        outline-offset: 2px;
      }

      #sound-toggle[aria-pressed='true'] .sound-waves {
        display: none;
      }

      #sound-toggle[aria-pressed='false'] .sound-slash {
        display: none;
      }
    </style>
  </head>
  <body>
    <button
      type="button"
      id="sound-toggle"
      aria-label="静音"
      aria-pressed="false"
    >
      <svg
        viewBox="0 0 16 16"
        width="24"
        height="24"
        aria-hidden="true"
        shape-rendering="crispEdges"
      >
        <g fill="#F2E3C6">
          <rect x="2" y="6" width="3" height="4" />
          <rect x="5" y="5" width="1" height="6" />
          <rect x="6" y="4" width="1" height="8" />
          <rect x="7" y="3" width="2" height="10" />
        </g>
        <g class="sound-waves" fill="#F2E3C6">
          <rect x="10" y="5" width="1" height="1" />
          <rect x="11" y="6" width="1" height="4" />
          <rect x="10" y="10" width="1" height="1" />
          <rect x="12" y="3" width="1" height="1" />
          <rect x="13" y="4" width="1" height="1" />
          <rect x="14" y="5" width="1" height="6" />
          <rect x="13" y="11" width="1" height="1" />
          <rect x="12" y="12" width="1" height="1" />
        </g>
        <g class="sound-slash" fill="#B03A2E">
          <rect x="12" y="2" width="2" height="2" />
          <rect x="10" y="4" width="2" height="2" />
          <rect x="8" y="6" width="2" height="2" />
          <rect x="6" y="8" width="2" height="2" />
          <rect x="4" y="10" width="2" height="2" />
          <rect x="2" y="12" width="2" height="2" />
        </g>
      </svg>
    </button>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
