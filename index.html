<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>夜巷</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}html,body{background-color:#10182b;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;display:flex;overflow:hidden}#game-container{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;justify-content:center;align-items:center;display:flex;position:relative}#game-container canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}#touch-overlay{z-index:10;pointer-events:none;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;position:absolute;inset:0}#touch-stick-zone{pointer-events:auto;touch-action:none;width:min(50%,100% - 224px);height:100%;position:absolute;top:0;left:0}#touch-stick-base{pointer-events:none;background-color:#ffffff14;border:2px solid #f2e3c666;border-radius:50%;display:none;position:absolute;transform:translate(-50%,-50%)}#touch-stick-knob{pointer-events:none;background-color:#f2e3c673;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}.touch-btn{color:#f2e3c6;cursor:pointer;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;background-color:#2e21188c;border:2px solid #c9973f;border-radius:50%;justify-content:center;align-items:center;padding:0;font-size:22px;line-height:1;display:flex;position:absolute}.touch-btn.pressed{color:#2e2118;background-color:#e8b34bbf;transform:scale(.92)}#sound-toggle{z-index:20;cursor:pointer;background-color:#2e2118;border:2px solid #c9973f;border-radius:0;justify-content:center;align-items:center;width:44px;height:44px;padding:0;display:inline-flex;position:fixed;top:12px;right:12px}#sound-toggle[hidden]{display:none}#sound-toggle:focus,#sound-toggle:focus-visible{outline-offset:2px;outline:2px solid #fbf6e9}#sound-toggle[aria-pressed=true] .sound-waves,#sound-toggle[aria-pressed=false] .sound-slash{display:none}</style>

          <rect x="12" y="2" width="2" height="2" />
          <rect x="10" y="4" width="2" height="2" />
          <rect x="8" y="6" width="2" height="2" />
